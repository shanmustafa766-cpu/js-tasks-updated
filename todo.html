<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        label {
            display: block;
            text-align: center;
            color: rgb(10, 81, 211);
            font-size: 18px;
            margin-top: 10px;
        }

        #inp {
            display: block;
            margin: auto;
            border: none;
            border-bottom: 1px solid grey;
            width: min(90%, 500px);
            height: 50px;
            font-size: 24px;
            color: rgb(10, 81, 211);
            box-sizing: border-box;
        }

        #inp::placeholder {
            color: rgb(10, 81, 211);
            text-align: center;
        }

        #inp:focus-visible {
            outline: 2px solid blue;
            outline-offset: 2px;
        }

        button:focus-visible,
        input[type="checkbox"]:focus-visible {
            outline: 2px solid orange;
            outline-offset: 2px;
        }

        .btn {
            display: block;
            border-radius: 15px;
            margin: 10px auto 0;
            border: none;
            width: 130px;
            height: 45px;
            font-size: 18px;
            background-color: blue;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        #msg {
            text-align: center;
            color: #c62828;
            font-size: 16px;
            min-height: 20px;
            margin: 8px 0 0;
        }

        table {
            width: min(95%, 800px);
            margin: 10px auto 0;
            text-align: center;
            border-collapse: collapse;
            color: rgb(10, 81, 211);
            font-size: 18px;
            border: 1px solid lightblue;
        }

        thead {
            color: blue;
        }

        thead,
        tr {
            height: 50px;
        }

        td {
            word-break: break-word;
        }

        .empty {
            text-align: center;
            color: #6b6b6b;
            font-size: 18px;
            padding: 20px;
        }

        table button {
            margin: auto;
            display: block;
            width: 60px;
            height: 35px;
            font-size: 18px;
            color: white;
            background-color: #c62828;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table button.edit-btn {
            background-color: #2e7d32;
        }

        table button:hover {
            filter: brightness(1.15);
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: #6b6b6b;
        }

        @media (max-width: 480px) {
            #inp {
                font-size: 20px;
            }

            table {
                font-size: 16px;
            }

            table button {
                width: 50px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <h1>TO-DO APP</h1>

    <form id="todoForm">
        <label for="inp">New task</label>
        <input type="text" id="inp" maxlength="200" autocomplete="off" placeholder="enter your todo.....">
        <button type="submit" class="btn">Add Task</button>
        <p id="msg" role="alert"></p>
    </form>

    <table>
        <thead>
            <tr>
                <th scope="col">STATUS</th>
                <th scope="col">DESCRIPTION</th>
                <th scope="col">EDIT</th>
                <th scope="col">DELETE</th>
            </tr>
        </thead>
        <tbody id="result"></tbody>
    </table>

    <script>
        const STORAGE_KEY = "myTodos";
        const inp = document.getElementById("inp");
        const msg = document.getElementById("msg");

        // Load tasks from storage; ignore anything that is not a valid task list
        function loadTasks() {
            try {
                const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!Array.isArray(stored)) return [];
                return stored
                    .filter((t) => t && typeof t.content === "string")
                    .map((t) => ({ content: t.content, completed: t.completed === true }));
            } catch {
                return [];
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch {
                msg.textContent = "Could not save tasks (storage is full or blocked).";
            }
        }

        let tasks = loadTasks();
        renderTasks();

        // Keep two open tabs in sync
        window.addEventListener("storage", (e) => {
            if (e.key === STORAGE_KEY) {
                tasks = loadTasks();
                renderTasks();
            }
        });

        // Form submit (also handles the Enter key)
        document.getElementById("todoForm").addEventListener("submit", (e) => {
            e.preventDefault();
            addTask();
        });

        function addTask() {
            const text = inp.value.trim();

            if (text === "") {
                msg.textContent = "Please enter a task.";
                inp.focus();
                return;
            }

            msg.textContent = "";
            inp.value = "";
            tasks.push({ content: text, completed: false });
            saveToStorage();
            renderTasks();
            inp.focus();
        }

        function renderTasks() {
            const tbody = document.getElementById("result");
            tbody.replaceChildren();

            if (tasks.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 4;
                td.className = "empty";
                td.textContent = "No tasks yet. Add one above!";
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];
                const tr = document.createElement("tr");

                const tdCheck = document.createElement("td");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = task.completed;
                cb.setAttribute("aria-label", "Mark task as done: " + task.content);
                cb.addEventListener("change", () => toggleStatus(i));
                tdCheck.appendChild(cb);

                const tdText = document.createElement("td");
                tdText.textContent = task.content;
                if (task.completed) tdText.classList.add("completed");

                const tdEdit = document.createElement("td");
                const editBtn = document.createElement("button");
                editBtn.type = "button";
                editBtn.className = "edit-btn";
                editBtn.textContent = "Edit";
                editBtn.setAttribute("aria-label", "Edit task: " + task.content);
                editBtn.addEventListener("click", () => editTask(i));
                tdEdit.appendChild(editBtn);

                const tdDel = document.createElement("td");
                const delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.textContent = "X";
                delBtn.setAttribute("aria-label", "Delete task: " + task.content);
                delBtn.addEventListener("click", () => deleteTask(i));
                tdDel.appendChild(delBtn);

                tr.append(tdCheck, tdText, tdEdit, tdDel);
                tbody.appendChild(tr);
            }
        }

        function toggleStatus(index) {
            tasks[index].completed = !tasks[index].completed;
            saveToStorage();
            renderTasks();
        }

        function editTask(index) {
            const next = prompt("Edit task:", tasks[index].content);
            if (next === null) return;

            const text = next.trim().slice(0, 200);
            if (text === "") return;

            tasks[index].content = text;
            saveToStorage();
            renderTasks();
        }

        function deleteTask(index) {
            if (!confirm("Delete this task?")) return;
            tasks.splice(index, 1);
            saveToStorage();
            renderTasks();
        }
    </script>
</body>

</html>

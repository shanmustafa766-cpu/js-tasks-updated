<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            background-image: linear-gradient(135deg, #6b6b6b, #2b2b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .cal {
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 12px;
            box-sizing: border-box;
        }

        .input input {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            margin-bottom: 10px;
            background-color: rgba(155, 155, 155, 0.3);
            color: ghostwhite;
            font-size: 1.5rem;
            border: none;
            border-radius: 15px;
            padding: 0 15px;
            text-align: right;
        }

        .output {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            width: 100%;
            height: 65px;
            font-size: 1.8rem;
            background-color: #555;
            color: ghostwhite;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:focus-visible {
            outline: 3px solid white;
            outline-offset: 2px;
        }

        .operator {
            background-color: orange;
            color: #111;
        }

        .res {
            background-color: #c62828;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="cal">
        <div class="input">
            <label for="inp" class="visually-hidden">Calculator display</label>
            <input type="text" id="inp" readonly aria-label="Calculator display">
        </div>
        <div class="output">
            <button type="button" class="operator btn" data-key="+" aria-label="Plus">+</button>
            <button type="button" class="btn" data-key="7">7</button>
            <button type="button" class="btn" data-key="8">8</button>
            <button type="button" class="btn" data-key="9">9</button>

            <button type="button" class="operator btn" data-key="-" aria-label="Minus">-</button>
            <button type="button" class="btn" data-key="4">4</button>
            <button type="button" class="btn" data-key="5">5</button>
            <button type="button" class="btn" data-key="6">6</button>

            <button type="button" class="operator btn" data-key="*" aria-label="Multiply">*</button>
            <button type="button" class="btn" data-key="1">1</button>
            <button type="button" class="btn" data-key="2">2</button>
            <button type="button" class="btn" data-key="3">3</button>

            <button type="button" class="operator btn" data-key="/" aria-label="Divide">/</button>
            <button type="button" class="btn" data-key="0">0</button>
            <button type="button" class="btn" data-key=".">.</button>
            <button type="button" class="btn" data-key="00">00</button>

            <button type="button" class="operator btn" data-action="clear" aria-label="Clear">C</button>
            <button type="button" class="operator btn" data-action="delete" aria-label="Delete last">DEL</button>
            <button type="button" class="res btn" data-action="calc" aria-label="Equals">=</button>
        </div>
    </div>

    <script>
        "use strict";

        const OPERATORS = "+-*/";
        const MAX_RESULT = 1e15;
        const MAX_INPUT_LENGTH = 40;

        const inp = document.getElementById("inp");
        let justEvaluated = false;
        let errorTimer = null;

        // ── Evaluator ──
        // Grammar:
        //   expression := term (("+" | "-") term)*
        //   term       := factor (("*" | "/") factor)*
        //   factor     := ("+" | "-")* number
        // Throws: "bad" (malformed), "div0" (x/0), "nan0" (0/0)
        function evaluate(text) {
            const expr = text.replace(/\s+/g, "");
            if (expr === "") throw new Error("bad");

            const tokens = expr.match(/\d+\.?\d*|\.\d+|[+\-*/]/g);
            if (!tokens || tokens.join("") !== expr) throw new Error("bad");

            let pos = 0;
            const peek = () => tokens[pos];
            const next = () => tokens[pos++];

            function factor() {
                let sign = 1;
                while (peek() === "+" || peek() === "-") {
                    if (next() === "-") sign = -sign;
                }
                const t = next();
                if (t === undefined || /^[+\-*/]$/.test(t)) throw new Error("bad");
                return sign * Number(t);
            }

            function term() {
                let value = factor();
                while (peek() === "*" || peek() === "/") {
                    const op = next();
                    const right = factor();
                    if (op === "/" && right === 0) {
                        if (value === 0) throw new Error("nan0");
                        throw new Error("div0");
                    }
                    value = op === "*" ? value * right : value / right;
                }
                return value;
            }

            function expression() {
                let value = term();
                while (peek() === "+" || peek() === "-") {
                    const op = next();
                    const right = term();
                    value = op === "+" ? value + right : value - right;
                }
                return value;
            }

            const result = expression();
            if (pos < tokens.length) throw new Error("bad");
            return result;
        }

        // Integers below 1e15 are exact in JavaScript, so print them directly.
        // Non-integers get 12 significant digits to hide float noise (0.1+0.2).
        function formatResult(n) {
            if (n === 0) return "0";
            if (Number.isInteger(n)) return String(n);
            if (Math.abs(n) < 1e-12) return "0";
            let s = String(Number(n.toPrecision(12)));
            if (s.includes("e")) {
                s = n.toFixed(12);
                if (s.includes(".")) s = s.replace(/\.?0+$/, "");
            }
            return s;
        }

        // ── Buttons ──
        document.querySelector(".output").addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;

            const key = btn.dataset.key;
            const action = btn.dataset.action;

            if (key) appendToDisplay(key);
            else if (action === "clear") clearDisplay();
            else if (action === "delete") deleteLast();
            else if (action === "calc") calculate();

            if (e.detail > 0) btn.blur();
        });

        function clearError() {
            if (errorTimer) {
                clearTimeout(errorTimer);
                errorTimer = null;
                inp.value = "";
            }
        }

        function appendToDisplay(ch) {
            clearError();

            if (justEvaluated) {
                if (/[0-9.]/.test(ch)) inp.value = "";
                justEvaluated = false;
            }

            if (inp.value.length >= MAX_INPUT_LENGTH) return;

            const value = inp.value;
            const last = value.slice(-1);
            const beforeLast = value.slice(-2, -1);

            if (OPERATORS.includes(ch)) {
                if (value === "") {
                    if (ch === "-") inp.value = "-";
                    return;
                }
                if (OPERATORS.includes(last)) {
                    if (ch === "-" && (last === "*" || last === "/")) {
                        inp.value += ch;
                        return;
                    }
                    if (OPERATORS.includes(beforeLast) && last === "-") {
                        inp.value = value.slice(0, -2) + ch;
                        return;
                    }
                    inp.value = value.slice(0, -1) + ch;
                    return;
                }
                inp.value += ch;
                return;
            }

            const current = value.split(/[+\-*/]/).pop();

            if (ch === ".") {
                if (current.includes(".")) return;
                if (current === "") {
                    inp.value += "0.";
                    return;
                }
                inp.value += ".";
                return;
            }

            if (current === "0") {
                if (ch === "0" || ch === "00") return;
                inp.value = value.slice(0, -1) + ch;
                return;
            }

            if (current === "" && ch === "00") {
                inp.value += "0";
                return;
            }

            inp.value += ch;
        }

        function clearDisplay() {
            clearError();
            inp.value = "";
            justEvaluated = false;
        }

        function deleteLast() {
            clearError();
            inp.value = inp.value.slice(0, -1);
            justEvaluated = false;
        }

        function showError(msg) {
            inp.value = msg;
            justEvaluated = false;
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                inp.value = "";
                errorTimer = null;
            }, 2000);
        }

        function calculate() {
            if (inp.value.trim() === "") return;

            try {
                const result = evaluate(inp.value);

                if (Number.isNaN(result)) {
                    showError("Invalid operation");
                    return;
                }
                if (!Number.isFinite(result)) {
                    showError("Cannot divide by 0");
                    return;
                }
                if (Math.abs(result) >= MAX_RESULT) {
                    showError("Number too large");
                    return;
                }

                inp.value = formatResult(result);
                justEvaluated = true;
            } catch (error) {
                if (error.message === "nan0") showError("Invalid operation");
                else if (error.message === "div0") showError("Cannot divide by 0");
                else showError("ERROR!");
            }
        }

        // ── Keyboard ──
        window.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            if ((e.key === "Enter" || e.key === " ") && e.target.closest("button")) return;

            const isDigit = /^[0-9.]$/.test(e.key);
            const isOperator = OPERATORS.includes(e.key) && e.key.length === 1;
            const isEnter = e.key === "Enter" || e.key === "=";
            const isBackspace = e.key === "Backspace";
            const isEscape = e.key === "Escape";

            if (!isDigit && !isOperator && !isEnter && !isBackspace && !isEscape) return;

            e.preventDefault();

            if (isDigit || isOperator) appendToDisplay(e.key);
            else if (isEnter) calculate();
            else if (isBackspace) deleteLast();
            else if (isEscape) clearDisplay();
        });
    </script>
</body>

</html>

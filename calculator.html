<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-image: linear-gradient(135deg, #6b6b6b, #2b2b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .cal {
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 12px;
            box-sizing: border-box;
        }

        .input input {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            margin-bottom: 10px;
            background-color: rgba(155, 155, 155, 0.3);
            color: ghostwhite;
            font-size: 1.5rem;
            border: none;
            border-radius: 15px;
            padding: 0 15px;
            text-align: right;
        }

        .output {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            width: 100%;
            height: 65px;
            font-size: 1.8rem;
            background-color: #555;
            color: ghostwhite;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:focus-visible {
            outline: 3px solid white;
            outline-offset: 2px;
        }

        .operator {
            background-color: orange;
            color: #111;
        }

        .res {
            background-color: #c62828;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="cal">
        <div class="input">
            <label for="inp" style="position:absolute;left:-9999px;">Calculator display</label>
            <input type="text" id="inp" readonly aria-label="Calculator display">
        </div>
        <div class="output">
            <button type="button" class="operator btn" data-key="+" aria-label="Plus">+</button>
            <button type="button" class="btn" data-key="7">7</button>
            <button type="button" class="btn" data-key="8">8</button>
            <button type="button" class="btn" data-key="9">9</button>

            <button type="button" class="operator btn" data-key="-" aria-label="Minus">-</button>
            <button type="button" class="btn" data-key="4">4</button>
            <button type="button" class="btn" data-key="5">5</button>
            <button type="button" class="btn" data-key="6">6</button>

            <button type="button" class="operator btn" data-key="*" aria-label="Multiply">*</button>
            <button type="button" class="btn" data-key="1">1</button>
            <button type="button" class="btn" data-key="2">2</button>
            <button type="button" class="btn" data-key="3">3</button>

            <button type="button" class="operator btn" data-key="/" aria-label="Divide">/</button>
            <button type="button" class="btn" data-key="0">0</button>
            <button type="button" class="btn" data-key=".">.</button>
            <button type="button" class="btn" data-key="00">00</button>

            <button type="button" class="operator btn" data-action="clear" aria-label="Clear">C</button>
            <button type="button" class="operator btn" data-action="delete" aria-label="Delete last">DEL</button>
            <button type="button" class="res btn" data-action="calc" aria-label="Equals">=</button>
        </div>
    </div>

    <script>
        const OPERATORS = "+-*/";
        const MAX_RESULT = 1e15;

        const inp = document.getElementById("inp");
        let justEvaluated = false;
        let errorTimer = null;

        // ── Evaluator ──
        // left-to-right, BODMAS: * and / before + and -
        function evaluate(text) {
            const expr = text.replace(/\s+/g, "");
            const tokens = expr.match(/\d+\.?\d*|\.\d+|[+\-*/]/g) || [];

            if (tokens.join("") !== expr) throw new Error("bad");

            let pos = 0;

            function number() {
                let sign = 1;
                while (tokens[pos] === "+" || tokens[pos] === "-") {
                    if (tokens[pos] === "-") sign = -sign;
                    pos++;
                }
                const t = tokens[pos++];
                if (t === undefined || /^[+\-*/]$/.test(t)) throw new Error("bad");
                return sign * Number(t);
            }

            function term() {
                let value = number();
                while (tokens[pos] === "*" || tokens[pos] === "/") {
                    const op = tokens[pos++];
                    const right = number();
                    if (op === "/" && right === 0) throw new Error("div0");
                    value = op === "*" ? value * right : value / right;
                }
                return value;
            }

            function expression() {
                let value = term();
                while (tokens[pos] === "+" || tokens[pos] === "-") {
                    const op = tokens[pos++];
                    const right = term();
                    value = op === "+" ? value + right : value - right;
                }
                return value;
            }

            const result = expression();
            if (pos < tokens.length) throw new Error("bad");
            return result;
        }

        // Round to 12 significant digits; never show exponent notation
        function formatResult(n) {
            if (n === 0) return "0";
            if (Math.abs(n) < 1e-12) return "0";
            let s = String(Number(n.toPrecision(12)));
            if (s.includes("e")) {
                s = n.toFixed(12);
                if (s.includes(".")) s = s.replace(/\.?0+$/, "");
            }
            return s;
        }

        // ── Buttons ──
        document.querySelector(".output").addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;

            const key = btn.dataset.key;
            const action = btn.dataset.action;

            if (key) appendToDisplay(key);
            else if (action === "clear") clearDisplay();
            else if (action === "delete") deleteLast();
            else if (action === "calc") calculate();

            // Mouse clicks drop focus so Space/Enter don't re-press.
            // Keyboard activation (detail === 0) keeps focus.
            if (e.detail > 0) btn.blur();
        });

        function clearError() {
            if (errorTimer) {
                clearTimeout(errorTimer);
                errorTimer = null;
                inp.value = "";
            }
        }

        function appendToDisplay(ch) {
            clearError();

            if (justEvaluated) {
                if (/[0-9.]/.test(ch)) inp.value = "";
                justEvaluated = false;
            }

            const value = inp.value;
            const last = value.slice(-1);

            if (OPERATORS.includes(ch)) {
                if (value === "") {
                    if (ch !== "-") return;
                } else if (OPERATORS.includes(last)) {
                    if (value.length === 1) return;
                    inp.value = value.slice(0, -1) + ch;
                    return;
                }
                inp.value += ch;
                return;
            }

            const current = value.split(/[+\-*/]/).pop();

            if (ch === ".") {
                if (current.includes(".")) return;
                if (current === "") {
                    inp.value += "0.";
                    return;
                }
            } else if (current === "0" || (current === "" && ch === "00")) {
                if (ch === "00" || ch === "0") {
                    if (current === "") inp.value += "0";
                    return;
                }
                inp.value = value.slice(0, value.length - current.length) + ch;
                return;
            }

            inp.value += ch;
        }

        function clearDisplay() {
            clearError();
            inp.value = "";
            justEvaluated = false;
        }

        function deleteLast() {
            clearError();
            inp.value = inp.value.slice(0, -1);
            justEvaluated = false;
        }

        function showError(msg) {
            inp.value = msg;
            justEvaluated = false;
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                inp.value = "";
                errorTimer = null;
            }, 2000);
        }

        function calculate() {
            if (inp.value.trim() === "") return;

            try {
                const result = evaluate(inp.value);

                // NaN: 0/0 type — invalid math, not divide-by-zero
                if (Number.isNaN(result)) {
                    showError("Invalid operation");
                    return;
                }

                // Infinity: 5/0 type
                if (!Number.isFinite(result)) {
                    showError("Cannot divide by 0");
                    return;
                }

                // Too big
                if (Math.abs(result) >= MAX_RESULT) {
                    showError("Number too large");
                    return;
                }

                inp.value = formatResult(result);
                justEvaluated = true;
            } catch (error) {
                if (error.message === "div0") {
                    showError("Cannot divide by 0");
                } else {
                    showError("ERROR!");
                }
            }
        }

        // ── Keyboard ──
        window.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            // A focused button handles its own Enter/Space
            if ((e.key === "Enter" || e.key === " ") && e.target.closest("button")) return;

            const isDigit = /^[0-9.]$/.test(e.key);
            const isOperator = OPERATORS.includes(e.key) && e.key.length === 1;
            const isEnter = e.key === "Enter" || e.key === "=";
            const isBackspace = e.key === "Backspace";
            const isEscape = e.key === "Escape";

            if (!isDigit && !isOperator && !isEnter && !isBackspace && !isEscape) return;

            e.preventDefault();

            if (isDigit || isOperator) appendToDisplay(e.key);
            else if (isEnter) calculate();
            else if (isBackspace) deleteLast();
            else if (isEscape) clearDisplay();
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        .app {
            margin: auto;
            text-align: center;
            padding: 10px;
        }

        .intro {
            background-color: blue;
            color: aliceblue;
            min-height: 70px;
            padding: 12px 10px;
            width: min(90%, 700px);
            margin: auto;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .head {
            color: rgba(46, 46, 172, 0.9);
        }

        label {
            display: block;
            color: rgb(10, 81, 211);
            font-size: 16px;
            margin-top: 10px;
        }

        #guess {
            display: block;
            margin: auto;
            height: 45px;
            width: min(80%, 320px);
            color: blueviolet;
            font-size: 25px;
            border: 1px solid whitesmoke;
            box-shadow: 3px 3px 15px lightblue, -3px -3px 15px lightblue;
            border-radius: 3px;
            box-sizing: border-box;
            text-align: center;
        }

        #guess::placeholder {
            color: purple;
        }

        #guess:focus-visible {
            outline: 2px solid blue;
            outline-offset: 2px;
        }

        button:focus-visible {
            outline: 2px solid orange;
            outline-offset: 2px;
        }

        #answer {
            color: rgba(46, 46, 172, 0.9);
        }

        button {
            width: min(60%, 220px);
            height: 50px;
            border: none;
            border-radius: 3px;
            background-color: blue;
            font-size: 22px;
            color: ghostwhite;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        p {
            font-size: 22px;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1 class="intro">NUMBER GUESSING GAME</h1>
        <h2 class="head">GUESS NUMBER BETWEEN 1-15!</h2>

        <form id="guessForm">
            <label for="guess">Your guess</label>
            <input type="text" id="guess" inputmode="numeric" maxlength="2" autocomplete="off"
                placeholder="guess the number..... ">
            <button type="submit">GUESS</button>
        </form>

        <p id="comment" aria-live="polite"></p>
        <p id="attempt" aria-live="polite"></p>
        <p id="answer" aria-live="polite"></p>
    </div>

    <script>
        const guessInput = document.getElementById("guess");
        const answer = document.getElementById("answer");
        const atm = document.getElementById("attempt");
        const cmt = document.getElementById("comment");
        const form = document.getElementById("guessForm");

        const min = 1;
        const max = 15;
        let target = Math.floor(Math.random() * (max - min + 1) + min);
        let attempt = 0;
        const guessed = new Set();

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            guessing();
        });

        function attemptLabel(n) {
            return n === 1 ? "ATTEMPT: 1" : "ATTEMPTS: " + n;
        }

        function guessing() {
            const raw = guessInput.value.trim();

            if (!/^\d+$/.test(raw)) {
                answer.textContent = "⚠ Please enter valid number between " + min + " and " + max;
                guessInput.value = "";
                guessInput.focus();
                return;
            }

            const guess = Number(raw);

            if (guess < min || guess > max) {
                answer.textContent = "⚠ Please enter valid number between " + min + " and " + max;
                guessInput.value = "";
                guessInput.focus();
                return;
            }

            if (guessed.has(guess)) {
                answer.textContent = "⚠ You already tried " + guess + "!";
                guessInput.value = "";
                guessInput.focus();
                return;
            }

            guessed.add(guess);
            attempt++;

            if (guess < target) {
                cmt.textContent = "YOUR GUESSED NUMBER IS: " + guess;
                answer.textContent = "⚠ Too low!!! ";
                atm.textContent = attemptLabel(attempt);
            }
            else if (guess > target) {
                cmt.textContent = "YOUR GUESSED NUMBER IS: " + guess;
                answer.textContent = "⚠ Too high!!! ";
                atm.textContent = attemptLabel(attempt);
            }
            else {
                const attemptsWord = attempt === 1 ? "attempt" : "attempts";
                answer.textContent = "🥇 Correct! " + guess + " was right! You got it in " +
                    attempt + " " + attemptsWord + ".";
                atm.textContent = attemptLabel(attempt);
                cmt.textContent = "🎯 I picked a new number between " + min + " and " + max + ". Try again!";

                attempt = 0;
                guessed.clear();
                target = Math.floor(Math.random() * (max - min + 1) + min);
            }

            guessInput.value = "";
            guessInput.focus();
        }
    </script>
</body>

</html>

</html>
